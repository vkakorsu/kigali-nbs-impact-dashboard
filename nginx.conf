server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro static output uses directory-style URLs (/map/ -> /map/index.html)
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    error_page 404 /404.html;

    # Long cache for hashed assets, short cache for HTML
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Basic hardening headers for a read-only public site
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content Security Policy scoped to what the dashboard actually loads:
    # self for its own assets, OpenStreetMap raster tiles for the map,
    # inline styles for Leaflet and React inline style attributes, and
    # the Sveltia editing screen at /admin (unpkg module, GitHub API).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.githubusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; worker-src 'self' blob:; manifest-src 'self' blob:; connect-src 'self' data: https://unpkg.com https://cdn.jsdelivr.net https://api.github.com https://github.com https://raw.githubusercontent.com https://www.githubstatus.com; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
