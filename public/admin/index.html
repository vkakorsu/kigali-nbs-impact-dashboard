  <head>
    <meta charset="utf-8" />

    <title>Content admin | Kigali NbS Impact Dashboard</title>
    <base href="/admin/" />

  </head>
  <body>
    <!--
      Sveltia CMS: a free, open source, ~300 KB editing screen over the
      plain files in this repository. This is the "simple back-end
      functionality sufficient for manual or semi-manual management of
      indicators, metadata, explanatory text, and visuals, without
      requiring a full content management system" that the RFP asks for.

      There is no server and no database. An editor signs in with a
      GitHub personal access token, edits indicators or stories in a
      form, and saves. The save is a version-controlled commit.
      A public rebuild follows only when the host is connected to git.
      Every change records who, what, and when, and any change can be
      rolled back.

      Token sign-in is required on this host. The default Sveltia
      GitHub button uses Netlify as an OAuth client, which this Vercel
      deployment is not.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
